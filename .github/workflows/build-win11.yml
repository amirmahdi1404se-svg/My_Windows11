name: Build Windows 11 for Tablet

on:
  workflow_dispatch:

jobs:
  build-win11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Files
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 cabextract wimtools chntpw genisoimage xorriso p7zip-full qemu-utils qemu-efi-aarch64 wget

      - name: Download & Build Official Windows 11 ISO
        run: |
          mkdir -p uup_work
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Using zip file: $LATEST_ZIP"
          unzip -o "$LATEST_ZIP" -d uup_work
          cd uup_work
          chmod +x uup_download_linux.sh
          sed -i 's/aria2c /aria2c --retry-wait=5 --max-tries=10 /g' uup_download_linux.sh
          ./uup_download_linux.sh || ./uup_download_linux.sh

      - name: Download VirtIO Laptop Drivers & Combine
        run: |
          wget -O virtio-win.iso https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
          mkdir -p iso_extract virtio_extract
          7z x uup_work/*.ISO -oiso_extract -y || 7z x uup_work/*.iso -oiso_extract -y
          7z x virtio-win.iso -ovirtio_extract -y
          cp autounattend.xml iso_extract/
          mkdir -p 'iso_extract/$WinPEDriver$'
          find virtio_extract -type d -iname "ARM64" -exec cp -r {}/* 'iso_extract/$WinPEDriver$/' \; 2>/dev/null || true
          EFI_BOOT=$(cd iso_extract && find . -iname "efisys_noprompt.bin" | sed 's|^\./||' | head -n 1)
          if [ -z "$EFI_BOOT" ]; then
            EFI_BOOT=$(cd iso_extract && find . -iname "efisys.bin" | sed 's|^\./||' | head -n 1)
          fi
          echo "Found UEFI Boot file: $EFI_BOOT"
          xorriso -as mkisofs -iso-level 3 -UDF -V "WIN11_ARM64" -e "$EFI_BOOT" -no-emul-boot -o win11_custom.iso iso_extract

      - name: Create Virtual Hard Drive & BIOS
        run: |
          qemu-img create -f qcow2 windows11.qcow2 32G
          cp /usr/share/AAVMF/AAVMF_CODE.fd UEFI_BIOS.fd

      - name: Upload Final Windows 11 Package
        uses: actions/upload-artifact@v4
        with:
          name: Windows11-Ready-For-Tablet
          path: |
            win11_custom.iso
            virtio-win.iso
            windows11.qcow2
            UEFI_BIOS.fd
